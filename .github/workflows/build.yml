on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Prerequisites
      run: .\build\vsts-prerequisites.ps1
      shell: pwsh
    - name: Build Documentation
      run: .\build\Build-Documentation.ps1 -UpdateMarkdown
      shell: pwsh
    - name: Commit Documentation Changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        $changes = git status --porcelain docs/
        if ($changes) {
          git add docs/
          git commit -m "chore: auto-update documentation [skip ci]"
          git push
          "Documentation updated and committed!"
        } else {
          "Documentation is already up to date."
        }
      shell: pwsh
    - name: Validate
      run: .\build\vsts-validate.ps1
      shell: pwsh
    - name: Build
      run: .\build\vsts-build.ps1 -ApiKey $env:APIKEY
      shell: pwsh
      env:
        APIKEY: ${{ secrets.ApiKey }}